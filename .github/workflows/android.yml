name: Build tablet app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The signing key lives in the repository secret KEYSTORE_B64 (base64 of the PKCS12 keystore), never in the repo,
      # so every build is signed the same way and installs as an update over the previous one.
      - name: Signing key from the repository secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KEYSTORE_B64 repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p android/signing
          echo "$KEYSTORE_B64" | base64 -d > android/signing/app.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TabletDashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TabletDashboard
          path: TabletDashboard.apk

      # Public download link for the tablet:
      # https://github.com/alanzobsoftware-lgtm/tablet-dashboard/releases/latest/download/TabletDashboard.apk
      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Tablet app (latest build)
          body: Open this page on the tablet and tap TabletDashboard.apk to install or update the app.
          files: TabletDashboard.apk
          make_latest: true
          overwrite_files: true
