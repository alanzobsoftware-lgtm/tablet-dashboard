<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f5f5f7; --text2: rgba(235,235,245,.64); --text3: rgba(235,235,245,.38);
    --card: rgba(255,255,255,.055); --line: rgba(255,255,255,.08);
    --glass: linear-gradient(180deg, rgba(255,255,255,.085) 0%, rgba(255,255,255,.035) 100%);
    --edge: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,255,255,.05);
    --lift: 0 14px 36px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.18);
    --accent: #8ab4f8; --up: #5fd68a; --down: #ff6b6b; --live: #ff453a; --r: 28px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a12; color: var(--text);
    font-family: Outfit, "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  /* The layout is drawn on a fixed 1280x800 stage (the tablet's native resolution) and scaled to fit the screen,
     so it looks identical whether Android reports 1280x800, 960x600 or anything else. */
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden; transform-origin: 0 0; }

  /* Background shifts with the time of day (Nest Hub "Ambient EQ" idea) */
  #bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; }
  body.t-night #bg { background: radial-gradient(1100px 800px at 12% 5%, #18203d 0%, transparent 60%), radial-gradient(900px 700px at 95% 100%, #111933 0%, transparent 60%), #05070d; }
  body.t-dawn  #bg { background: radial-gradient(1100px 800px at 12% 5%, #4a3550 0%, transparent 60%), radial-gradient(900px 700px at 95% 100%, #23304f 0%, transparent 60%), #120f1d; }
  body.t-day   #bg { background: radial-gradient(1100px 800px at 12% 5%, #22406b 0%, transparent 60%), radial-gradient(900px 700px at 95% 100%, #16304f 0%, transparent 60%), #0b1424; }
  body.t-dusk  #bg { background: radial-gradient(1100px 800px at 12% 5%, #5a2f3d 0%, transparent 60%), radial-gradient(900px 700px at 95% 100%, #2b2350 0%, transparent 60%), #140d1a; }

  #app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 1fr 68px; grid-template-columns: minmax(0, 1fr); }   /* never wider than the screen, even with a long headline */
  #main { min-height: 0; display: grid; grid-template-columns: 420px 1fr; gap: 22px; padding: 26px 30px 10px; }
  #left, #right { min-height: 0; display: flex; flex-direction: column; gap: 18px; }

  .card { background: var(--glass); box-shadow: var(--edge), var(--lift); border-radius: var(--r); padding: 18px 22px;
    min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .card-h { display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
    font-size: 15px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
  .chev { color: var(--text3); margin-left: 6px; letter-spacing: 0; }
  .err { font-size: 14px; color: var(--down); margin-top: 6px; }
  .err:empty { display: none; }
  .empty { color: var(--text2); font-size: 16px; line-height: 1.45; }

  /* Clock */
  #clock { display: flex; align-items: baseline; gap: 10px; line-height: .9; }
  #time { font-size: 150px; font-weight: 200; letter-spacing: -4px; font-variant-numeric: tabular-nums; text-shadow: 0 6px 40px rgba(0,0,0,.35); }
  #ampm { font-size: 28px; font-weight: 300; color: var(--text2); }
  #date { font-size: 26px; font-weight: 300; color: var(--text2); margin-top: 10px; }

  /* Weather */
  .wx-now { display: flex; align-items: center; gap: 10px; }
  .wx-now img { width: 84px; height: 84px; margin: -8px -4px -8px -10px; }
  .wx-temp { font-size: 62px; font-weight: 200; line-height: 1; }
  .wx-desc { font-size: 18px; color: var(--text2); line-height: 1.35; margin-left: 8px; }
  .sun { display: flex; align-items: center; font-size: 15px; color: var(--text2); white-space: nowrap; margin-top: 1px; }
  .sun img { width: 30px; height: 30px; margin: -8px 0 -8px -6px; }
  .sun img.set { margin-left: 4px; }
  #wx-days { display: flex; gap: 10px; margin: 12px 0 -14px; padding-bottom: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain; scrollbar-width: none; }   /* 8 days; 4 fill the width, swipe for the rest */
  #wx-days::-webkit-scrollbar { display: none; }
  .wx-day { flex: 0 0 calc((100% - 30px) / 4); scroll-snap-align: start; text-align: center; padding: 8px 4px 10px; border-radius: 20px; background: var(--glass); box-shadow: var(--edge), 0 6px 16px rgba(0,0,0,.22); }
  .wx-day b { display: block; font-size: 15px; font-weight: 500; color: var(--text2); }
  .wx-day img { width: 44px; height: 44px; display: block; margin: 0 auto; }
  .wx-day span { display: block; font-size: 17px; }
  .wx-day small { color: var(--text3); font-size: 15px; }
  .wx-day .p { font-size: 14px; color: var(--accent); }

  /* Agenda */
  #agenda { flex: 1 1 auto; }
  #cal { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }   /* swipe to see more days */
  #cal::-webkit-scrollbar { display: none; }
  #cal.fade { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent); }
  .allday { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .ad { display: inline-flex; align-items: baseline; gap: 7px; max-width: 100%; box-sizing: border-box; font-size: 16px; line-height: 1.25; padding: 5px 12px 5px 13px;
    border-radius: 10px; background: color-mix(in srgb, var(--c) 22%, rgba(255,255,255,.03)); box-shadow: inset 3px 0 0 var(--c); }
  .ad .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ad i { font-style: normal; font-size: 13px; color: var(--text2); white-space: nowrap; flex: 0 0 auto; }
  .cal-more { font-size: 14px; letter-spacing: .02em; text-transform: none; color: var(--text3); }
  #agenda { cursor: pointer; }
  .wk-day { padding: 14px 0 12px; border-top: 1px solid var(--line); }
  .wk-day:first-child { border-top: 0; padding-top: 4px; }
  .wk-h { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .wk-h small { font-size: 15px; font-weight: 400; color: var(--text2); margin-left: 8px; }
  .wk-ev { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; font-size: 18px; line-height: 1.35; }
  .wk-ev .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; transform: translateY(-2px); }
  .wk-ev .t { flex: 0 0 150px; color: var(--text2); font-size: 16px; font-variant-numeric: tabular-nums; }
  .wk-ev .s { flex: 1; min-width: 0; }
  .wk-ev .s small { display: block; color: var(--text3); font-size: 14px; margin-top: 1px; }
  .wk-ev.past { opacity: .45; }
  .wk-none { color: var(--text3); font-size: 16px; padding: 2px 0; }
  .day-h { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: .04em; margin: 10px 0 2px; }
  .day-h:first-child { margin-top: 0; }
  .ev { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; font-size: 18px; line-height: 1.3; }
  .ev .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; transform: translateY(-2px); }
  .ev .t { color: var(--text2); font-size: 16px; flex: 0 0 76px; font-variant-numeric: tabular-nums; }
  .ev .s { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Story cards: one featured headline that rotates, plus what's next */
  #sections { flex: 1 1 auto; min-height: 0; display: grid; gap: 18px; }
  .sec-t { cursor: pointer; }
  .feat { cursor: pointer; transition: opacity .6s; }
  .feat.out { opacity: 0; }
  .feat .src { font-size: 16px; color: var(--accent); font-weight: 500; margin-bottom: 6px; }
  .feat .hl { font-size: 28px; font-weight: 400; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .feat .ago { font-size: 15px; color: var(--text3); margin-top: 8px; }
  .more { margin-top: auto; border-top: 1px solid var(--line); padding-top: 4px; }
  .more .it { padding: 7px 0; font-size: 17px; line-height: 1.3; color: var(--text2); cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more .it b { color: var(--text3); font-weight: 500; font-size: 14px; margin-right: 6px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
  .dots i.on { background: var(--text); }

  /* Scoreboard */
  #scores { flex: 0 0 auto; }
  #score-grid { display: grid; gap: 12px; }
  .team { border-radius: 18px; padding: 12px 14px; min-width: 0; background: rgba(255,255,255,.05);
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 16%, transparent) 0%, rgba(255,255,255,.03) 55%);
    box-shadow: inset 0 2px 0 var(--tc), inset 0 0 0 1px rgba(255,255,255,.05); }
  .team .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .team .hd img { width: 34px; height: 34px; object-fit: contain; }
  .team .nm { font-size: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .row { display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--text2); margin-top: 6px; white-space: nowrap; overflow: hidden; }
  .team .row img { width: 20px; height: 20px; object-fit: contain; flex: 0 0 20px; }
  .team .row b { color: var(--text); font-weight: 500; }
  .team .row .op { overflow: hidden; text-overflow: ellipsis; }
  .team .w { color: var(--up) !important; }
  .team .l { color: var(--down) !important; }
  .team .live b { color: var(--live); }
  .team .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: 0 0 7px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* Bottom bar */
  #bar { display: flex; align-items: center; gap: 16px; padding: 0 30px 12px; min-width: 0; }
  #radio { display: flex; align-items: center; gap: 10px; background: var(--glass); box-shadow: var(--edge), var(--lift); border-radius: 999px; padding: 6px 16px 6px 6px; flex: 0 0 auto; }
  #r-play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--text); color: #000; font-size: 14px; }
  #r-play, #r-stop { display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
  #r-stop { width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: var(--text); }
  #r-stop[hidden] { display: none; }
  #r-station { background: transparent; color: var(--text); border: 0; font: inherit; font-size: 15px; max-width: 200px; }
  #r-station option { background: #1c1f26; }
  #r-vol { width: 80px; accent-color: #f5f5f7; }
  #ticker { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; overflow: hidden; white-space: nowrap; height: 40px; }   /* one quote at a time */
  #ticker-track { display: inline-block; line-height: 40px; font-size: 18px; color: var(--text2); }
  #ticker .dots { align-self: center; }
  #headline { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 40px; padding-left: 18px; border-left: 1px solid var(--line); cursor: pointer; }
  #headline .hl-src { flex: 0 0 auto; font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #headline .hl-t { flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ticker.still { -webkit-mask-image: none; mask-image: none; }   /* nothing scrolling: no edge fade */
  #ticker-track span span { margin-left: 4px; }
  #ticker-track b { color: var(--text); font-weight: 500; }
  .up { color: var(--up); } .down { color: var(--down); }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  #status { font-size: 14px; color: var(--down); }
  #gear { background: none; border: 0; color: var(--text3); font-size: 22px; padding: 6px; }
  #sleep { background: none; border: 0; color: var(--text3); padding: 6px; display: flex; align-items: center; }   /* sleep now, wake at sunrise */
  #sleep.on { color: #ff6b5e; }
  #n-until { font-size: 20px; font-weight: 300; opacity: .3; margin-top: 14px; }

  /* Night: StandBy-style dim red clock */
  #night { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; color: #ff3b30; z-index: 5; }
  #night.on { display: flex; }
  body.sleeping #app { visibility: hidden; }   /* nothing behind the night clock gets drawn */
  body.sleeping #ticker-track, body.sleeping .team .live::before { animation-play-state: paused; }
  #n-time { font-size: 300px; font-weight: 200; letter-spacing: -8px; line-height: 1; opacity: .35; font-variant-numeric: tabular-nums; }
  #n-date { font-size: 28px; font-weight: 300; opacity: .25; margin-top: 10px; }

  /* Sheets */
  .modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(4,6,12,.62); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { background: linear-gradient(180deg, #23272f 0%, #1a1d24 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.55); border-radius: 32px; width: 94%; max-width: 860px; max-height: 88%; overflow-y: auto; padding: 28px 32px; }
  .sheet h3 { margin: 0 0 8px; font-size: 28px; font-weight: 500; line-height: 1.2; }
  .sheet .m { color: var(--text2); font-size: 15px; margin-bottom: 14px; }
  .sheet p { font-size: 20px; line-height: 1.55; font-weight: 300; white-space: pre-wrap; }
  .sheet .lb { display: block; font-size: 13px; color: var(--text2); margin: 16px 0 6px; }
  .sheet input[type=text], .sheet textarea { width: 100%; background: #0f1116; color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    font-size: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; -webkit-user-select: text; user-select: text; }
  .sheet textarea { height: 170px; }
  .sheet pre { font-size: 12px; color: var(--text2); white-space: pre-wrap; max-height: 200px; overflow: auto; }
  .row-b { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn { background: rgba(255,255,255,.1); color: var(--text); border: 0; border-radius: 999px; height: 44px; padding: 0 20px; font: inherit; font-size: 16px; }
  .btn.primary { background: var(--text); color: #000; font-weight: 500; }
  .note { font-size: 13px; color: var(--text2); margin-top: 6px; }
  .note.bad { color: var(--down); }
  label.tog { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 19px; cursor: pointer; }
  .tog span { flex: 1; }
  .tog input { position: absolute; opacity: 0; pointer-events: none; }
  .tog i { display: block; width: 52px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.16); position: relative; flex: 0 0 52px; transition: background .2s; }
  .tog i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .tog input:checked + i { background: #34c759; }
  .tog input:checked + i::after { transform: translateX(20px); }

  /* Countdowns */
  #countdowns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #countdowns:empty { display: none; }
  .cd { font-size: 15px; color: var(--text2); background: rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); border-radius: 999px; padding: 5px 12px; }
  .cd b { color: var(--text); font-weight: 500; }

  /* Severe weather alert (only shown while one is active) */
  #alert { display: flex; align-items: center; gap: 12px; border-radius: 22px; padding: 12px 16px; cursor: pointer; flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(255,69,58,.30), rgba(255,69,58,.14)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 26px rgba(0,0,0,.3); }
  #alert.moderate { background: linear-gradient(180deg, rgba(255,159,10,.30), rgba(255,159,10,.13)); }
  #alert.minor { background: linear-gradient(180deg, rgba(138,180,248,.24), rgba(138,180,248,.10)); }
  #alert .ic { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 20px; }
  #alert .tx { min-width: 0; }
  #alert .ev { font-size: 18px; font-weight: 500; }
  #alert .ev small { color: var(--text2); font-size: 14px; font-weight: 400; }
  #alert .sub { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.warn { color: #ffb340; }

  /* Reader, game details, stock editor */
  .sheet.wide { max-width: 980px; }
  .story { max-width: 800px; }
  .story p { font-size: 21px; line-height: 1.6; margin: 0 0 16px; font-weight: 300; white-space: normal; }
  .story p b { font-weight: 500; }
  .loading { color: var(--text2); font-size: 16px; padding: 6px 0; }
  .team, #ticker { cursor: pointer; }
  .gm-top { display: flex; align-items: center; justify-content: center; gap: 32px; margin: 4px 0; }
  .gm-team { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 160px; text-align: center; }
  .gm-team img { width: 76px; height: 76px; object-fit: contain; }
  .gm-team .n { font-size: 19px; font-weight: 500; }
  .gm-team .rec { font-size: 13px; color: var(--text3); }
  .gm-score { font-size: 66px; font-weight: 200; font-variant-numeric: tabular-nums; }
  .gm-status { text-align: center; color: var(--text2); font-size: 15px; margin: 6px 0 18px; }
  .gm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .gm-box { background: rgba(255,255,255,.05); box-shadow: inset 0 1px 0 rgba(255,255,255,.07); border-radius: 20px; padding: 14px 18px; }
  .gm-box h4 { margin: 0 0 8px; font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--text2); }
  .gm-box table { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
  .gm-box td { padding: 4px 0; }
  .gm-box td + td { text-align: right; padding-left: 12px; }
  .gm-box td.lbl { color: var(--text2); }
  .gm-box .ld { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 16px; }
  .gm-box .ld span { color: var(--text2); }
  .gm-box .ld b { font-weight: 500; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 16px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 8px 8px 8px 16px; font-size: 18px; font-weight: 500; }
  .chip button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: var(--text); font-size: 14px; }
  .add-row { display: flex; gap: 10px; align-items: center; }
  .add-row input { flex: 1; text-transform: uppercase; }


</style>
</head>
<body class="t-day">
<div id="stage">
<div id="bg"></div>
<div id="app">
  <main id="main">
    <section id="left">
      <div>
        <div id="clock"><span id="time">--:--</span><span id="ampm"></span></div>
        <div id="date"></div>
        <div id="countdowns"></div>
      </div>
      <div id="weather"></div>
      <div id="alert" hidden></div>
      <div class="card" id="agenda">
        <div class="card-h"><span id="cal-title">Up next</span><span class="cal-more">Week ›</span></div>
        <div id="cal"></div><div class="err" id="cal-err"></div>
      </div>
    </section>
    <section id="right">
      <div id="sections"></div>
      <div class="card" id="scores" hidden>
        <div class="card-h"><span id="scores-title">Scoreboard</span></div>
        <div id="score-grid"></div>
      </div>
    </section>
  </main>
  <footer id="bar">
    <div id="radio">
      <button id="r-play" aria-label="Play"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 1.8v10.4l8.6-5.2z" fill="currentColor"/></svg></button>
      <button id="r-stop" aria-label="Stop" hidden><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><rect x=".5" y=".5" width="10" height="10" rx="2" fill="currentColor"/></svg></button>
      <select id="r-station" aria-label="Station"></select>
      <input id="r-vol" type="range" min="0" max="1" step="0.05" aria-label="Volume">
    </div>
    <div id="ticker"><div id="ticker-track"></div><span class="dots" id="tk-dots"></span></div>
    <div id="headline"></div>
    <span id="status"></span>
    <button id="sleep" aria-label="Sleep until sunrise"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/></svg></button>

  var e = ((cfg.night || {}).end || '06:00').split(':'), d = new Date(); d.setHours(+e[0], +e[1] || 0, 0, 0);   // no forecast: the usual wake time

}

};

function sunLine(d) {   // today's sunrise and sunset, under "Feels"

/* ---------- Severe weather alerts (National Weather Service: free, no key) ---------- */

function loadAlerts() {
  var L = cfg.location || {};

  fetchWithTimeout('https://api.weather.gov/alerts/active?point=' + L.lat + ',' + L.lon, 15000)
    .then(function (r) { return r.json(); })
    .then(function (j) {

        .filter(function (p) { return p && p.status === 'Actual'; })

/* ---------- Calendar ("Up next") ---------- */
var gcalUrl = LS.get('dash.gcalUrl', '');
(function () {
  var m = /[#&]gcal=([^&]+)/.exec(location.hash);
  if (m) {
    try { gcalUrl = decodeURIComponent(m[1]); LS.set('dash.gcalUrl', gcalUrl); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  }
})();
var gcalStatus = '', calMissing = false, calSeq = 0;
function loadGoogle(from, days) {
  var g = cfg.googleCalendar || {}, names = g.calendars || [], colors = g.colors || {};
  var u = gcalUrl + (gcalUrl.indexOf('?') < 0 ? '?' : '&') + 'days=' + days +

    });

}
function loadCalendar() {
  var cals = (cfg.calendars || []).filter(function (c) { return c && c.url; });
  var useGoogle = !!gcalUrl && (cfg.googleCalendar || {}).enabled !== false;
  calMissing = !cals.length && !useGoogle;
  var from = startOfDay(new Date()), days = cfg.calendarDays || 7, to = addDays(from, days), errors = [];
  if (calMissing) { renderCalendar([], from, days); return; }
  var jobs = useGoogle ? [loadGoogle(from, days).catch(function () { errors.push('Google Calendar'); return null; })] : [];
  jobs = jobs.concat(cals.map(function (c) {
    return fetchText(c.url).then(function (t) {
      return eventsInRange(parseICS(t), from, to).map(function (o) { o.color = c.color || '#8ab4f8'; return o; });
    }).catch(function () { errors.push(c.name || 'calendar'); return null; });
  }));

    lists.forEach(function (l) { if (l) all = all.concat(l); else failed = true; });
    if (failed && !all.length) {

      if (cache) all = cache.map(function (o) { o.start = new Date(o.start); o.end = new Date(o.end); return o; });
    } else LS.set('dash.cache.cal', all);
    renderCalendar(all, from, days);

    $('cal-err').textContent = errors.length ? 'Couldn’t refresh: ' + errors.join(', ') : '';
  });
}
var calAll = [];
function renderCalendar(all, from, days) {
  var box = $('cal'), h = '', n = 0, seen = {}, uniq = {}, now = new Date();
  all = all.filter(function (o) {               // the same event on two shared calendars shows once
    var k = o.summary + '|' + (+o.start) + '|' + (+o.end) + '|' + !!o.allDay;
    if (uniq[k]) return false;
    return (uniq[k] = true);
  });

  for (var i = 0; i < days; i++) {
    var ds = addDays(from, i), de = addDays(from, i + 1);

    var ad = evs.filter(function (o) {            // all-day: shown once, on the first day in view

    }).join('') + '</div>';

/* ---------- Scrollable strips: a fade hints there's more, and they drift back to the start after 2 idle minutes ---------- */

/* ---------- Week view: tap the calendar card for the next 7 days, day by day ---------- */
var weekTimer;
function openWeek() {
  var from = startOfDay(new Date()), now = new Date(), h = '';
  for (var i = 0; i < 7; i++) {
    var ds = addDays(from, i), de = addDays(from, i + 1);
    var evs = calAll.filter(function (o) { return o.start < de && (o.end > ds || (+o.end === +o.start && o.start >= ds)); });
    var ad = evs.filter(function (o) { return o.allDay; });
    var timed = evs.filter(function (o) { return !o.allDay; }).sort(function (x, y) { return x.start - y.start; });
    h += '<div class="wk-day"><div class="wk-h">' + (i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : ds.toLocaleDateString([], { weekday: 'long' })) +
         '<small>' + ds.toLocaleDateString([], { weekday: i < 2 ? 'short' : undefined, month: 'short', day: 'numeric' }) + '</small></div>';
    if (ad.length) h += '<div class="allday">' + ad.map(function (o) {
      return '<span class="ad" style="--c:' + esc(o.color) + '"><span class="s">' + esc(o.summary) + '</span></span>';
    }).join('') + '</div>';
    timed.forEach(function (o) {
      var t = o.start < ds ? 'until ' + shortTime(o.end) : shortTime(o.start) + (+o.end > +o.start && o.end <= de ? ' – ' + shortTime(o.end) : '');
      var sub = [o.location, (o.cal || '').replace(/@.*$/, '')].filter(Boolean).map(esc).join(' · ');
      h += '<div class="wk-ev' + (o.end <= now && +o.end !== +o.start ? ' past' : '') + '"><span class="dot" style="background:' + esc(o.color) + '"></span>' +
           '<span class="t">' + t + '</span><span class="s">' + esc(o.summary) + (sub ? '<small>' + sub + '</small>' : '') + '</span></div>';
    });
    if (!ad.length && !timed.length) h += '<div class="wk-none">Nothing planned</div>';
    h += '</div>';
  }
  $('wk-body').innerHTML = calMissing ? '<div class="empty">Add your Google Calendar: tap ⚙ and paste your Google bridge link.</div>' : h;
  $('week').hidden = false;
  $('week').querySelector('.sheet').scrollTop = 0;
  clearTimeout(weekTimer);
  weekTimer = setTimeout(function () { $('week').hidden = true; }, 180000);   // back to the dashboard if left open
}
$('agenda').onclick = openWeek;
$('wk-close').onclick = function () { $('week').hidden = true; };
$('week').onclick = function (e) { if (e.target === this) this.hidden = true; };   // tap outside the sheet to close

/* ---------- Countdowns ----------
   config.countdowns (public holidays) + personalDates (private, from the bridge), each one of:
     { label, date: "YYYY-MM-DD", yearly: true|false }    fixed date (the year is ignored when yearly)
     { label, rule: "easter" }                            Easter Sunday
     { label, rule: "4 thu 11" }                          4th Thursday of November; "-1 mon 5" = last Monday of May
   Optional showWithinDays (default 120). */
function holidayDate(c, y) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.date || '');
  if (m) return c.yearly ? new Date(y, +m[2] - 1, +m[3]) : new Date(+m[1], +m[2] - 1, +m[3]);
  var r = String(c.rule || '').toLowerCase().trim();
  if (r === 'easter') {
    var a = y % 19, b = Math.floor(y / 100), k = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
        g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(k / 4), kk = k % 4,
        l = (32 + 2 * e + 2 * i - h - kk) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451), n = h + l - 7 * mm + 114;
    return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
  }
  var q = /^(-?[1-5])\s+(sun|mon|tue|wed|thu|fri|sat)\s+(\d{1,2})$/.exec(r);
  if (q) {
    var nth = +q[1], dow = 'sunmontuewedthufrisat'.indexOf(q[2]) / 3, mon = +q[3] - 1;
    if (nth > 0) return new Date(y, mon, 1 + (dow - new Date(y, mon, 1).getDay() + 7) % 7 + (nth - 1) * 7);
    var last = new Date(y, mon + 1, 0);
    return new Date(y, mon, last.getDate() - (last.getDay() - dow + 7) % 7);
  }
  return null;
}
function renderCountdowns() {
  var today = startOfDay(new Date()), y = today.getFullYear(), out = [];
  (cfg.countdowns || []).concat(cfg.personalDates || []).forEach(function (c) {
    if (!c) return;
    var d = holidayDate(c, y);
    if (d && (c.yearly || c.rule) && d < today) d = holidayDate(c, y + 1);
    if (!d || isNaN(d)) return;
    var days = Math.round((d - today) / 864e5);
    if (days >= 0 && days <= (c.showWithinDays || 120)) out.push({ label: c.label, days: days });
  });
  out.sort(function (a, b) { return a.days - b.days; });
  $('countdowns').innerHTML = out.slice(0, cfg.countdownMax || 3).map(function (c) {
    return '<span class="cd"><b>' + esc(c.label) + '</b> · ' + (c.days === 0 ? 'Today' : c.days === 1 ? 'Tomorrow' : c.days + ' days') + '</span>';
  }).join('');
}

/* ---------- Freshness: say so quietly when something hasn't updated in a while ---------- */
var lastOk = {};
function markOk(k) { lastOk[k] = Date.now(); }
function staleCheck() {
  var R = cfg.refresh || {}, now = Date.now(), old = [], msg = '';
  var limits = { weather: (R.weatherMin || 30) * 3, news: (R.newsMin || 15) * 4, scores: (R.gamesMin || 30) * 3 };
  for (var k in limits) if (lastOk[k] && now - lastOk[k] > limits[k] * 60000) old.push(k + ' ' + ago(new Date(lastOk[k])));
  if (navigator.onLine === false) msg = 'No internet · showing saved info';
  else if (old.length) msg = 'Not updated: ' + old.join(', ');
  else if (configStatus.ok === false) msg = 'Settings offline';
  $('status').textContent = msg;
  $('status').className = msg ? 'warn' : '';
}
window.addEventListener('offline', staleCheck);
window.addEventListener('online', function () { applyConfig(); checkConfig(); });   // back online: refresh everything

/* ---------- Google bridge ---------- */
function bridge(type, params) {
  if (!gcalUrl) return Promise.reject(new Error('no bridge'));
  var u = gcalUrl + (gcalUrl.indexOf('?') < 0 ? '?' : '&') + 'type=' + type;
  for (var k in params) u += '&' + k + '=' + encodeURIComponent(params[k]);
  return fetchWithTimeout(u + '&_=' + Date.now(), 30000).then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) throw new Error(j.error); return j; });
}

/* ---------- Feeds: direct, then rss2json, then the Google bridge, then the CORS proxy ---------- */
function rss2json(f) {
  return fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.url), 15000)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.status !== 'ok') throw new Error(j.message || 'rss2json');
      return j.items.map(function (i) {
        return { title: htmlToText(i.title), link: i.link, date: i.pubDate ? new Date(i.pubDate.replace(' ', 'T') + 'Z') : null,
                 source: f.name || '', rawDesc: i.description || '', raw: i.content || '' };
      });
    });
}
function fetchFeedItems(f) {
  var name = f.name || '';
  function parsed(x) { var it = parseFeed(x, name); if (!it.length) throw new Error('empty feed'); return it; }
  return fetchWithTimeout(f.url, 8000).then(function (r) { return r.text(); }).then(parsed)
    .catch(function () { return rss2json(f); })
    .catch(function () { return bridge('feed', { url: f.url }).then(function (j) { return parsed(j.body); }); })
    .catch(function () {
      if (!cfg.corsProxy) throw new Error('no proxy');
      return fetchWithTimeout(cfg.corsProxy + encodeURIComponent(f.url), 20000).then(function (r) { return r.text(); }).then(parsed);
    });
}

/* ---------- Sections: each is a card with a rotating featured headline ---------- */

    .filter(function (s) { return s.feeds && s.feeds.length; });
}
function activeFeeds(list) { return (list || []).filter(function (f) { return f && f.url && f.enabled !== false && !feedsOff[f.url]; }); }

/* ---------- Stocks ---------- */
function quoteFinnhub(sym) {
  return fetchWithTimeout('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(sym) + '&token=' + encodeURIComponent(cfg.finnhubKey), 10000)
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || !j.c) throw new Error('no data'); return { sym: sym, price: j.c, pct: j.dp }; });
}

    var m = JSON.parse(t).chart.result[0].meta, prev = m.chartPreviousClose || m.previousClose;
    return { sym: sym, price: m.regularMarketPrice, pct: prev ? (m.regularMarketPrice - prev) / prev * 100 : 0 };
  });
}

  var syms = cfg.stocks || [];

  var job;
  if (cfg.finnhubKey) job = Promise.all(syms.map(function (s) { return quoteFinnhub(s).catch(function () { return null; }); }));
  else if (gcalUrl) job = bridge('stocks', { symbols: syms.join(',') }).then(function (j) { return j.quotes || []; }).catch(function () { return []; });

  else job = Promise.resolve([]);
  job.then(function (qs) {
    qs = (qs || []).filter(Boolean);
    // Fall back to the last good prices, but only for symbols still on the list
    if (!qs.length) qs = LS.get('dash.cache.quotes', []).filter(function (q) { return syms.indexOf(q.sym) >= 0; }); else LS.set('dash.cache.quotes', qs);
    renderTicker(qs);

}

}

  if (!tickQ.length) return;
  var n = tickQ.length, i = tickI % n, q = tickQ[i], up = q.pct >= 0, dots = '';
  for (var k = 0; k < n && n > 1; k++) dots += '<i' + (k === i ? ' class="on"' : '') + '></i>';
  $('ticker-track').innerHTML = '<span><b>' + esc(q.sym) + '</b> ' + Number(q.price).toFixed(2) + ' <span class="' + (up ? 'up' : 'down') + '">' +
    (up ? '▲' : '▼') + Math.abs(q.pct || 0).toFixed(2) + '%</span></span>';
  $('tk-dots').innerHTML = dots;
}
var tkHold = null, tkHeld = false;
$('ticker').addEventListener('pointerdown', function () { tkHeld = false; tkHold = setTimeout(function () { tkHeld = true; openStocks(); }, 650); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('ticker').addEventListener(ev, function () { clearTimeout(tkHold); }); });

/* ---------- Top stories (bottom bar): general-audience headlines, one at a time; tap to read the story ---------- */
var hlItems = LS.get('dash.cache.headlines', []).map(function (x) { x.date = x.date ? new Date(x.date) : null; return x; }), hlI = 0;
function loadHeadlines() {
  var H = cfg.headlines || {}, feeds = activeFeeds(H.feeds), per = H.perFeed || 4;
  if (!feeds.length) { hlItems = []; renderHeadline(); return; }
  Promise.all(feeds.map(function (f) { return fetchFeedItems(f).then(function (it) { return it.slice(0, per); }).catch(function () { return []; }); }))
    .then(function (lists) {
      var out = [], max = Math.max.apply(null, lists.map(function (l) { return l.length; }).concat([0]));
      for (var k = 0; k < max; k++) lists.forEach(function (l) { if (l[k]) out.push(l[k]); });   // take turns between the sources
      if (out.length) { hlItems = out; LS.set('dash.cache.headlines', out.map(lite)); }
      renderHeadline();
    });
}
function renderHeadline() {
  if (!hlItems.length) { $('headline').innerHTML = ''; return; }
  var it = hlItems[hlI % hlItems.length];
  $('headline').innerHTML = '<span class="hl-src">' + esc(it.source) + '</span><span class="hl-t">' + esc(it.title) + '</span>';
}
$('headline').onclick = function () { if (hlItems.length) openReader(hlItems[hlI % hlItems.length]); };

/* ---------- Radio ---------- */
var audio = $('audio');
function setupRadio() {
  var st = (cfg.radio && cfg.radio.stations) || [], sel = $('r-station');
  function val(s) { return s.podcast ? 'podcast:' + s.podcast : s.url; }
  var prev = LS.get('dash.radio.station', st[0] ? val(st[0]) : '');
  sel.innerHTML = st.map(function (s) { return '<option value="' + esc(val(s)) + '">' + esc(s.name) + '</option>'; }).join('');
  if (st.some(function (s) { return val(s) === prev; })) sel.value = prev;
  $('radio').style.display = st.length ? '' : 'none';
  audio.volume = LS.get('dash.radio.vol', 0.6);
  $('r-vol').value = audio.volume;
  if (cfg.radio && cfg.radio.autoplay && LS.get('dash.radio.playing', false) && audio.paused) play();
}
var PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 1.8v10.4l8.6-5.2z" fill="currentColor"/></svg>';
var PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.6" y="1.8" width="3.2" height="10.4" rx="1" fill="currentColor"/><rect x="8.2" y="1.8" width="3.2" height="10.4" rx="1" fill="currentColor"/></svg>';
var radioState = 'stopped', pausedAt = 0;   // stopped | playing | paused
function setRadio(s) {
  radioState = s;
  $('r-play').innerHTML = s === 'playing' ? PAUSE_ICON : PLAY_ICON;
  $('r-play').setAttribute('aria-label', s === 'playing' ? 'Pause' : 'Play');
  $('r-stop').hidden = s === 'stopped';
  LS.set('dash.radio.playing', s === 'playing');
}
function play() {   // start the selected station (for NPR News Now: the newest newscast)
  var url = $('r-station').value;
  if (!url) return;
  setRadio('playing');
  if (url.indexOf('podcast:') === 0) {
    latestEpisode(url.slice(8)).then(function (mp3) {
      if ($('r-station').value !== url || radioState !== 'playing') return;
      audio.src = mp3;
      var q = audio.play();
      if (q && q.catch) q.catch(function () { setRadio('stopped'); });
    }).catch(function () { setRadio('stopped'); });
    return;
  }
  audio.src = url;
  var p = audio.play();
  if (p && p.catch) p.catch(function () { setRadio('stopped'); });
}
function pause() { audio.pause(); pausedAt = Date.now(); setRadio('paused'); }
function resume() {
  var live = $('r-station').value.indexOf('podcast:') !== 0;
  if (live && Date.now() - pausedAt > 30000) audio.load();   // a live station picks up at "now", not where you paused
  setRadio('playing');
  var p = audio.play();
  if (p && p.catch) p.catch(function () { play(); });
}
function stop() { audio.pause(); audio.removeAttribute('src'); audio.load(); setRadio('stopped'); }
function latestEpisode(feed) {
  return bridge('feed', { url: feed }).then(function (j) {
    var e = new DOMParser().parseFromString(j.body || '', 'text/xml').querySelector('item enclosure');
    if (!e) throw new Error('no episode');
    return e.getAttribute('url');
  }).catch(function () {
    return fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed), 15000)
      .then(function (r) { return r.json(); })
      .then(function (j) { var it = j.items && j.items[0], u = it && it.enclosure && it.enclosure.link; if (!u) throw new Error('no episode'); return u; });
  });
}
$('r-play').onclick = function () {
  if (radioState === 'playing') pause();
  else if (radioState === 'paused' && audio.src) resume();
  else play();
};
$('r-stop').onclick = stop;
$('r-station').onchange = function () { LS.set('dash.radio.station', this.value); if (radioState !== 'stopped') play(); };
audio.addEventListener('ended', function () { if ($('r-station').value.indexOf('podcast:') === 0) stop(); });   // the newscast finished
audio.addEventListener('error', function () { if (audio.src) setTimeout(function () { if (radioState === 'playing') play(); }, 10000); });

/* ---------- Remote config ---------- */
function bust(u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(); }
function checkConfig() {
  loadPrivate();
  return fetchWithTimeout(bust(configUrl), 15000).then(function (r) { return r.json(); })
    .then(function (j) {
      configStatus = { ok: true, at: new Date(), msg: '' };
      var s = JSON.stringify(j);
      if (s !== remoteStr) { remote = j; remoteStr = s; LS.set('dash.remote', j); applyConfig(); }
      else showStatus();
    })
    .catch(function (e) { configStatus = { ok: false, at: new Date(), msg: String(e && e.message || e) }; showStatus(); });
}
function showStatus() {
  staleCheck();
  $('s-status').textContent = configStatus.at ? (configStatus.ok ? 'Last checked ' + fmtTime(configStatus.at) + ' — OK' : 'Last check ' + fmtTime(configStatus.at) + ' failed: ' + configStatus.msg + ' (using saved copy)') : 'Not checked yet';
  $('s-status').className = 'note' + (configStatus.ok === false ? ' bad' : '');
}
function every(min, fn) { fn(); timers.push(setInterval(fn, Math.max(1, min || 15) * 60000)); }
function applyConfig() {
  computeCfg();
  if (!priv && gcalUrl) loadPrivate();
  timers.forEach(clearInterval); timers = [];
  document.title = cfg.title || 'Home';
  $('cal-title').textContent = cfg.calTitle || 'Up next';
  buildSections();
  var R = cfg.refresh || {};
  timers.push(setInterval(checkConfig, Math.max(1, R.configMin || 5) * 60000));
  every(R.weatherMin || 30, loadWeather);
  every(R.alertsMin || 10, loadAlerts);
  renderCountdowns();
  every(R.calendarMin || 15, loadCalendar);
  every(R.gamesMin || 30, loadGames);
  every(R.newsMin || 15, function () { getSections().forEach(function (s, i) { loadSection(i); }); });
  every(R.stocksMin || 5, loadStocks);
  timers.push(setInterval(function () { if (tickQ.length > 1) { tickI++; showQuote(); } }, Math.max(3, (cfg.ticker && cfg.ticker.rotateSec) || 10) * 1000));
  every(R.newsMin || 15, loadHeadlines);
  timers.push(setInterval(function () { if (hlItems.length > 1) { hlI++; renderHeadline(); } }, Math.max(5, (cfg.headlines && cfg.headlines.rotateSec) || 12) * 1000));
  timers.push(setInterval(rotate, Math.max(5, cfg.rotateSec || 12) * 1000));
  setupRadio();
  lastClock = '';
  tick();
  showStatus();
}

/* ---------- Settings ---------- */
$('gear').onclick = function () {
  $('s-url').value = configUrl;
  $('s-gcal').value = gcalUrl;
  $('s-gstatus').textContent = gcalUrl ? gcalStatus : '';
  $('s-local').value = Object.keys(local || {}).length ? JSON.stringify(local, null, 2) : '';
  $('s-err').textContent = '';
  $('s-eff').textContent = JSON.stringify(cfg, null, 2);
  showStatus();
  $('settings').hidden = false;
};
$('s-close').onclick = function () { $('settings').hidden = true; };
$('s-save').onclick = function () {
  var txt = $('s-local').value.trim(), parsed = {};
  if (txt) { try { parsed = JSON.parse(txt); } catch (e) { $('s-err').textContent = 'That isn’t valid JSON: ' + e.message; $('s-err').className = 'note bad'; return; } }
  local = parsed; LS.set('dash.local', local);
  gcalUrl = $('s-gcal').value.trim(); LS.set('dash.gcalUrl', gcalUrl);
  var u = $('s-url').value.trim() || 'config.json', urlChanged = u !== configUrl;
  configUrl = u; LS.set('dash.configUrl', u);
  $('settings').hidden = true;
  if (urlChanged) { remoteStr = ''; checkConfig(); } else { applyConfig(); loadPrivate(); }
};
$('s-clear').onclick = function () { local = {}; LS.del('dash.local'); $('s-local').value = ''; applyConfig(); $('s-eff').textContent = JSON.stringify(cfg, null, 2); };
$('s-check').onclick = function () { checkConfig().then(function () { $('s-eff').textContent = JSON.stringify(cfg, null, 2); }); };
$('s-reload').onclick = function () { location.reload(); };

/* ---------- Scale the 1280x800 stage to the screen ---------- */
/* Re-measured whenever the screen settles or changes (Android can report a temporary size while it switches to
   full screen / landscape), plus a cheap check every 2 seconds in case no resize event arrives. */
var lastFit = '';
function fit() {
  var de = document.documentElement, vv = window.visualViewport;
  var w = de.clientWidth || window.innerWidth, h = de.clientHeight || window.innerHeight;
  if (vv && vv.width && vv.height) { w = Math.min(w, vv.width); h = Math.min(h, vv.height); }
  if (!w || !h) return;
  var key = w + 'x' + h;
  if (key === lastFit) return;
  lastFit = key;
  var s = Math.min(w / 1280, h / 800);
  $('stage').style.transform = s === 1 ? 'none' : 'translate(' + Math.round((w - 1280 * s) / 2) + 'px,' + Math.round((h - 800 * s) / 2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
window.addEventListener('load', fit);
setInterval(fit, 2000);
fit();

/* ---------- Start ---------- */
applyConfig();
checkConfig();
setInterval(tick, 1000);
})();
</script>
